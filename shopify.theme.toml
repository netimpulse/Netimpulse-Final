# Shopify CLI – Theme-Konfiguration
#
# Shop: NetImpulsemarketing (live unter netimpulsemarketing.de)
# Es gibt bewusst nur das Test-Environment: Aus diesem Repo wird nie ins
# Live-Theme gepusht (siehe CLAUDE.md und .claude/hooks/block-live-push.js).

[environments.development]
store = "a50c23-ed.myshopify.com"
theme = "210831737177" # „Netimpulse-Final – Test" (unveröffentlicht)

ignore = [
  "tests/**",
  "playwright.config.ts",
  "playwright/**",
  "qa-screenshots/**",
  "playwright-report/**",
  "test-results/**",
  "package.json",
  "package-lock.json",
  "node_modules/**",
  ".env*",
  ".gitignore",
  ".claude/**",
  ".mcp.json",
  "CLAUDE.md"
]
